name: release

# Publish to npm when a v* tag is pushed. Uses npm trusted publishing (OIDC): no
# NODE_AUTH_TOKEN / NPM_TOKEN secret — GitHub's OIDC identity is exchanged for a short-lived
# npm credential, and provenance is attached automatically. See README → Releasing for the
# one-time trusted-publisher setup on npmjs.com.
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write # required for OIDC trusted publishing + provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --experimental-sqlite # node:sqlite (required on Node 22, no-op on 24)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs a recent npm (>= 11.5.1); make sure we have it.
      - run: npm install -g npm@latest

      - run: npm ci
      - run: npm run build
      - run: npm test

      # No token: --provenance + OIDC (id-token: write) authenticate via the trusted publisher.
      - run: npm publish --provenance --access public
