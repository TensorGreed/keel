name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref so a fast push doesn't queue behind a stale one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: build + test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # Linux carries the supported Node range; Windows runs Node 22 only (the floor in `engines`)
      # to bound minutes — what that leg tests is the platform, not the runtime version.
      matrix:
        include:
          - { os: ubuntu-latest, node: '22' }
          - { os: ubuntu-latest, node: '24' }
          - { os: windows-latest, node: '22' }
    steps:
      # Keel's fixtures are byte-exact inputs to the graph, the diff parser, and the report
      # parsers, and .gitattributes pins them to LF. Turning autocrlf off as well means a Windows
      # checkout can't reintroduce CRLF for anything the attributes file doesn't cover.
      - name: Keep the checkout LF-only
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci
      - run: npm run build

      # node:sqlite is available without a flag since Node 22.13 / 23.4 (see engines: >=22.13).
      # We deliberately do NOT pass --experimental-sqlite: it's unnecessary now and would abort
      # node ("bad option") on any version that has since dropped the flag.
      - run: npm test
